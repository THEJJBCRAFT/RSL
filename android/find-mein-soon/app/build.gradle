plugins {
    id "com.android.application"
}

// Die Web-App (apps/find-mein-soon) wird als Asset in die APK gepackt; es wird nichts von einer Website geladen.
// Werte lassen sich beim Bauen ueberschreiben, z. B.:
//   ./gradlew assembleRelease -PshareUrl=https://deine-domain/apps/find-mein-soon/ -PversionCode=42
// shareUrl ist nur die oeffentliche Adresse der Web-App fuer Einladungslinks (App-Links), nicht die Datenquelle.
def shareUrl = (findProperty("shareUrl") ?: "https://thejjbcraft.github.io/RSL/apps/find-mein-soon/").toString().trim()
def shareUri = new URI(shareUrl)
def shareHost = shareUri.host ?: "thejjbcraft.github.io"
def sharePath = (shareUri.path ?: "/").replaceAll("/+\$", "")
if (sharePath.isEmpty()) sharePath = "/"
def buildNumber = (findProperty("versionCode") ?: "1").toString().toInteger()
def buildName = (findProperty("versionName") ?: "2.0.${buildNumber}").toString()
def keystorePath = findProperty("keystoreFile")?.toString()
def hasReleaseKeystore = keystorePath && file(keystorePath).exists()

android {
    namespace "de.redstonelabs.findmeinsoon"
    compileSdk 35

    defaultConfig {
        applicationId "de.redstonelabs.findmeinsoon"
        minSdk 24
        targetSdk 35
        versionCode buildNumber
        versionName buildName
        manifestPlaceholders = [shareHost: shareHost, sharePath: sharePath]
    }

    sourceSets {
        main {
            // Enthaelt den Ordner find-mein-soon -> Assets unter "find-mein-soon/…"
            assets.srcDirs += ["../../../apps"]
        }
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystorePath)
                storePassword findProperty("keystorePassword")?.toString()
                keyAlias findProperty("keyAlias")?.toString()
                // PKCS12-Keystores (Standard von keytool seit JDK 9) kennen kein eigenes Schluessel-Passwort.
                keyPassword (findProperty("keyPassword") ?: findProperty("keystorePassword"))?.toString()
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // Ohne eigenen Keystore wird mit dem Debug-Schluessel signiert, damit die APK trotzdem installierbar ist.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
