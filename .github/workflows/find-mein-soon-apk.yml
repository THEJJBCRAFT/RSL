name: Find Mein Soon APK

# Baut die Android-App (APK) fuer Find Mein Soon. Die Web-App (apps/find-mein-soon) wird dabei in die APK gepackt,
# die App braucht keine Website und keinen eigenen Server.
# - Bei jedem Push auf main mit Aenderungen am Android-Projekt oder an der Web-App
# - Manuell ueber "Actions" -> "Find Mein Soon APK" -> "Run workflow"
#
# Die fertige APK liegt danach unter "Releases" (Tag find-mein-soon-latest) und als Artefakt am Workflow-Lauf.
# Auf anderen Branches als main wird nur das Artefakt erzeugt (ausser bei manuellem Start).
#
# Einstellungen (optional):
# - Repository-Variable FMS_APP_URL: oeffentliche Adresse der Web-App fuer Einladungslinks,
#   Standard https://thejjbcraft.github.io/RSL/apps/find-mein-soon/
# - Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD:
#   eigener Signatur-Schluessel, damit Updates ohne Deinstallation moeglich sind (siehe README).

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "android/find-mein-soon/**"
      - "apps/find-mein-soon/**"
      - ".github/workflows/find-mein-soon-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

# Alle Laeufe nacheinander, damit sich zwei Laeufe nicht gleichzeitig am selben Release zu schaffen machen.
concurrency:
  group: find-mein-soon-apk
  cancel-in-progress: false

jobs:
  build:
    name: APK bauen
    runs-on: ubuntu-latest
    env:
      SHARE_URL: ${{ vars.FMS_APP_URL || 'https://thejjbcraft.github.io/RSL/apps/find-mein-soon/' }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'findmeinsoon' }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'findmeinsoon' }}
      # PKCS12-Keystores (Standard von keytool) haben kein eigenes Schluessel-Passwort, darum Fallback auf das Keystore-Passwort.
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'findmeinsoon' }}

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Signatur-Schluessel vorbereiten
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "SIGNING_NOTE=Signiert mit dem hinterlegten Keystore. Updates lassen sich direkt ueber die alte Version installieren." >> "$GITHUB_ENV"
          else
            # Einmaliger Schluessel: PKCS12 kennt nur ein Passwort, deshalb Keystore- und Schluessel-Passwort gleichsetzen.
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" -storetype PKCS12 \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=Find Mein Soon, O=Redstone Labs, C=DE"
            echo "KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_NOTE=Signiert mit einem einmaligen Schluessel. Vor der Installation einer neueren Version muss die alte App deinstalliert werden. Fuer Updates ohne Deinstallation den Keystore als Secret hinterlegen (siehe README)." >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: android/find-mein-soon
        run: |
          set -euo pipefail
          echo "Adresse fuer Einladungslinks: $SHARE_URL"
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PshareUrl="$SHARE_URL" \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="2.0.${{ github.run_number }}" \
            -PkeystoreFile="$KEYSTORE_FILE" \
            -PkeystorePassword="$KEYSTORE_PASSWORD" \
            -PkeyAlias="$KEY_ALIAS" \
            -PkeyPassword="$KEY_PASSWORD"

      - name: APK einsammeln und pruefen
        run: |
          set -euo pipefail
          cp android/find-mein-soon/app/build/outputs/apk/release/app-release.apk FindMeinSoon.apk
          ls -la FindMeinSoon.apk
          # Die Web-App muss in der APK stecken.
          unzip -l FindMeinSoon.apk | grep -E "assets/find-mein-soon/(index\.html|app\.js|vendor/mqtt/mqtt\.min\.js)" || (echo "Web-App fehlt in der APK" && exit 1)

      - name: APK als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: FindMeinSoon-apk-build-${{ github.run_number }}
          path: FindMeinSoon.apk
          if-no-files-found: error

      - name: APK unter Releases veroeffentlichen
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="find-mein-soon-latest"
          TITLE="Find Mein Soon APK (Build ${{ github.run_number }})"
          NOTES_FILE="$RUNNER_TEMP/notes.md"
          {
            echo "Android-App fuer Find Mein Soon, Build ${{ github.run_number }} (Version 2.0.${{ github.run_number }}, Commit ${{ github.sha }})."
            echo
            echo "Die App laeuft komplett fuer sich: kein Konto, keine Website, kein eigener Server. Die Handys einer Gruppe tauschen ihre Standorte Ende-zu-Ende verschluesselt ueber oeffentliche MQTT-Broker aus."
            echo
            echo "Installation: APK auf dem Handy herunterladen, oeffnen und die Installation aus unbekannten Quellen erlauben."
            echo
            echo "$SIGNING_NOTE"
          } > "$NOTES_FILE"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # Bestehendes Release aktualisieren, damit der feste Download-Link nie ins Leere zeigt.
            git push --force origin "${{ github.sha }}:refs/tags/$TAG"
            gh release upload "$TAG" FindMeinSoon.apk --clobber --repo "${{ github.repository }}"
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" --repo "${{ github.repository }}"
          else
            gh release create "$TAG" FindMeinSoon.apk \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
          fi
          echo "Download: https://github.com/${{ github.repository }}/releases/download/$TAG/FindMeinSoon.apk"
