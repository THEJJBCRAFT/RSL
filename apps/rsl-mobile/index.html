<!doctype html>
<html lang="de" data-boot="pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>RSL</title>
  </head>
  <body>
    <!-- Weiche Aurora-Flächen, niedrig aufgelöst gerendert und hochskaliert. -->
    <canvas id="aurora" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <!-- Boot-Overlay: Logo zeichnet sich, danach faltet sich die Shell auf. -->
    <div class="boot" id="boot" aria-hidden="true">
      <svg class="boot__mark" viewBox="0 0 120 120" fill="none">
        <path
          class="boot__stroke"
          d="M22 96V24h30a20 20 0 0 1 0 40H34l30 32M78 24v56a16 16 0 0 0 16 16h6"
          stroke="url(#bootGrad)"
          stroke-width="9"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <defs>
          <linearGradient id="bootGrad" x1="14" y1="18" x2="106" y2="104" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8b6cff" />
            <stop offset="1" stop-color="#2ee6d6" />
          </linearGradient>
        </defs>
      </svg>
    </div>

    <div class="shell" id="shell">
      <header class="topbar">
        <div class="topbar__brand">
          <svg class="logo" viewBox="0 0 120 120" fill="none" aria-hidden="true">
            <path
              d="M22 96V24h30a20 20 0 0 1 0 40H34l30 32M78 24v56a16 16 0 0 0 16 16h6"
              stroke="url(#railGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
            <defs>
              <linearGradient id="railGrad" x1="14" y1="18" x2="106" y2="104" gradientUnits="userSpaceOnUse">
                <stop stop-color="#8b6cff" /><stop offset="1" stop-color="#2ee6d6" />
              </linearGradient>
            </defs>
          </svg>
          <div class="topbar__text">
            <strong>RSL</strong>
            <small>Content Cr3w</small>
          </div>
        </div>
        <button class="acct" id="acctBtn" data-fx aria-label="Minecraft-Konto">
          <span class="acct__head" id="acctHead" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.2-3.4 4-5 7.5-5s6.3 1.6 7.5 5"/></svg>
          </span>
          <span class="acct__name" id="acctLabel">Anmelden</span>
        </button>
      </header>

      <main class="stage" id="stage">
        <!-- Views werden gerendert -->
      </main>

      <!-- Menue unten: alle Ziele liegen im Daumenbereich. -->
      <nav class="tabbar" aria-label="Hauptmenue">
        <div class="tabbar__nav" id="nav">
          <span class="tabbar__pill" id="pill" aria-hidden="true"></span>
          <!-- Nav-Items werden aus routes.ts erzeugt -->
        </div>
      </nav>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
